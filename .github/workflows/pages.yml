name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          set -euo pipefail
          mkdir -p _site
          git archive --format=tar HEAD | tar -x -C _site
          rm -rf _site/.github _site/_src _site/scripts
          rm -f \
            _site/.gitignore \
            _site/README_DEPLOYMENT.md \
            _site/google-play-data-safety-keyboard.md \
            _site/package.json
          find _site/downloads -type f ! -name 'TapFixAI-macOS-latest.dmg' -delete
          du -sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
